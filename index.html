<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator using javascript - Easy Tutorial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <form>
                <div class="display">
                    <input type="text" name="display">
                </div>
                <div>
                   <div>
                    <input type="button" value="AC" onclick="display.value = ''" class="btn-ac">
                    <input type="button" value="DE" onclick="display.value = display.value.toString().slice(0,-1)" class="btn-de">
                    <input type="button" value="." onclick="display.value += '.'" class="btn-titik">
                    <input type="button" value="/" onclick="display.value += '/'" class="btn-bagi">
                </div>
                <div>
                    <input type="button" value="7" onclick="display.value += '7'" class="btn-7">
                    <input type="button" value="8" onclick="display.value += '8'" class="btn-8">
                    <input type="button" value="9" onclick="display.value += '9'" class="btn-9">
                    <input type="button" value="*" onclick="display.value += '*'" class="btn-kali">
                </div>
                <div>
                    <input type="button" value="4" onclick="display.value += '4' " class="btn-4">
                    <input type="button" value="5" onclick="display.value += '5' " class="btn-5">
                    <input type="button" value="6" onclick="display.value += '6' " class="btn-6">
                    <input type="button" value="-" onclick="display.value += '-'" class="btn-kurang">
                </div>
                <div>
                    <input type="button" value="1" onclick="display.value += '1' " class="btn-1">
                    <input type="button" value="2" onclick="display.value += '2' " class="btn-2">
                    <input type="button" value="3" onclick="display.value += '3' " class="btn-3">
                    <input type="button" value="+" onclick="display.value += '+'" class="btn-tambah">
                </div>
                <div>
                    <input type="button" value="00" onclick="display.value += '00'" class="btn-00">
                    <input type="button" value="0" onclick="display.value += '0'" class="btn-0">
                    <input type="button" value="=" onclick="display.value = eval(display.value)" class="equal btn-samadengan">
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
